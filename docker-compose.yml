services:

  # ---------------------------------------------------------------------
  # n8n - orquestrador do fluxo (webhooks, chamadas HTTP, chamada ao LLM)
  # ---------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: rag_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_DEFAULT_LOCALE=pt-BR
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Credenciais básicas de acesso à interface (mude se desejar)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=minicurso123
      # Restrição de acesso a arquivos do n8n (desde 1.x): só permite acesso
      # a esta pasta. Por isso montamos ./docs dentro dela abaixo.
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./docs:/home/node/.n8n-files/docs:ro
    depends_on:
      - python-api
      - qdrant
    networks:
      - rag_network

  # ---------------------------------------------------------------------
  # Qdrant - banco de dados vetorial (armazena os embeddings dos chunks)
  # ---------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # API REST/gRPC
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_network

  # ---------------------------------------------------------------------
  # Python API - etapas de processamento: extração, chunking, embeddings,
  # indexação no Qdrant e busca por similaridade (embeddings via OpenRouter)
  # ---------------------------------------------------------------------
  python-api:
    build: ./python-api
    container_name: rag_python_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./python-api:/app
      - ./docs:/app/docs
    depends_on:
      - qdrant
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  n8n_data:
  qdrant_data:
